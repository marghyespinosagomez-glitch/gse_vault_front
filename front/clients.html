<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Gestor de clientes - GSE Vault</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
    <div class="appHeader">
        <div class="pageTitle">GSE Vault</div>
    </div>

    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="./clients.html" class="sidebar-link active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                Clientes
            </a>
            <a href="./keys.html" class="sidebar-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3">
                    </path>
                </svg>
                Llaves
            </a>
            <a href="./admins.html" id="nav-admins" class="sidebar-link" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"></path>
                </svg>
                Administradores
            </a>
        </nav>
        <a href="#" id="link-logout" class="sidebar-link sidebar-logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar sesión
        </a>
    </aside>

    <main class="app-content">
    <div class="page-wrapper-wide">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar cliente por nombre o correo..."
                    autocomplete="off" />
            </div>
            <button type="button" id="btn-open-modal" class="btn btn-primary btn-create">+ Crear cliente</button>
        </div>

        <div class="table-card">
            <table class="clients-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Tipo de seguridad</th>
                        <th>Opciones</th>
                    </tr>
                </thead>
                <tbody id="clients-tbody">
                </tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                Aún no hay clientes. Crea el primero con el botón "+ Crear cliente".
            </div>
        </div>
    </div>
    </main>

    <!-- Modal: crear cliente -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Crear cliente</h2>
                <button type="button" id="btn-close-modal" class="modal-close">&times;</button>
            </div>

            <div id="modal-alert" class="alert alert-danger"></div>

            <form id="create-client-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="client-nombre">Nombre</label>
                    <input type="text" id="client-nombre" class="form-control" placeholder="Ej: Juan Pérez" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="client-correo">Correo</label>
                    <input type="text" id="client-correo" class="form-control" placeholder="cliente@correo.com" />
                    <small id="client-correo-feedback" class="form-hint"></small>
                </div>
                <div class="form-group">
                    <label class="form-label" for="client-pass">Contraseña</label>
                    <input type="password" id="client-pass" class="form-control" placeholder="Minimo 8 caracteres"
                        autocomplete="new-password" />
                    <ul id="client-pass-requirements" class="password-requirements">
                        <li data-rule="length">8+ caracteres</li>
                        <li data-rule="upper">Una mayúscula</li>
                        <li data-rule="lower">Una minúscula</li>
                        <li data-rule="number">Un número</li>
                        <li data-rule="symbol">Un símbolo</li>
                    </ul>
                </div>
                <div class="form-group">
                    <label class="form-label" for="client-typeauth">Tipo de seguridad</label>
                    <select id="client-typeauth" class="form-control">
                        <option value="simple">Simple</option>
                        <option value="auth">Auth</option>
                    </select>
                </div>

                <button type="submit" id="btn-submit-client" class="btn btn-primary">Crear cliente</button>
            </form>
        </div>
    </div>

    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/clients.js"></script>
</body>

</html>
